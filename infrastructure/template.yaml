
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ApplyTrack serverless job application tracker. No EC2 resources.

Parameters:
  FrontendOrigin:
    Type: String
    Default: https://applytrack-0zts.onrender.com
    Description: Primary frontend origin for API and S3 CORS

  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted UI domain prefix, lowercase letters/numbers/hyphens
    AllowedPattern: '^[a-z0-9-]+$'

  ExistingApplicationsTableName:
    Type: String
    Default: ApplyTrackApplications
    Description: Name of the existing DynamoDB applications table

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        APPLICATIONS_TABLE: !Ref ExistingApplicationsTableName
        RESUMES_BUCKET: !Ref ResumesBucket
        ALLOWED_ORIGIN: !Ref FrontendOrigin

Resources:
  ApplyTrackApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - http://localhost:3000
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer

  ResumesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
              - http://localhost:3000
            AllowedMethods:
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 3000

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ApplyTrackUsers
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ApplyTrackWebClient
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub '${FrontendOrigin}/'
        - !Ref FrontendOrigin
        - http://localhost:3000/login
      LogoutURLs:
        - !Sub '${FrontendOrigin}/'
        - !Ref FrontendOrigin
        - http://localhost:3000/
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  ApplicationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../backend/
      Handler: dist/applications.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExistingApplicationsTableName
      Events:
        ListApplications:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /applications
            Method: GET
        CreateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /applications
            Method: POST
        GetApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /applications/{id}
            Method: GET
        UpdateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /applications/{id}
            Method: PUT
        DeleteApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /applications/{id}
            Method: DELETE

  ResumeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../backend/
      Handler: dist/resume.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ResumesBucket
      Events:
        PresignResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApplyTrackApi
            Path: /resume/presign
            Method: POST

Outputs:
  ApiUrl:
    Description: ApplyTrack API endpoint
    Value: !Sub 'https://${ApplyTrackApi}.execute-api.${AWS::Region}.amazonaws.com'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'

  ResumeBucketName:
    Description: Private S3 bucket for resume uploads
    Value: !Ref ResumesBucket
